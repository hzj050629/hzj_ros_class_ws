# 关节状态控制器（必须，用于发布关节状态）
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50.0

# 机械臂关节轨迹控制器（核心，支持rqt轨迹控制）
arm_joint_trajectory_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - claw_joint_1
    - claw_joint_2
  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05
    joint_1: {trajectory: 0.1, goal: 0.05}
    joint_2: {trajectory: 0.1, goal: 0.05}
    joint_3: {trajectory: 0.1, goal: 0.05}
    joint_4: {trajectory: 0.1, goal: 0.05}
    joint_5: {trajectory: 0.1, goal: 0.05}
    claw_joint_1: {trajectory: 0.1, goal: 0.05}
    claw_joint_2: {trajectory: 0.1, goal: 0.05}
  stop_trajectory_duration: 0.5
  state_publish_rate: 50.0
  action_monitor_rate: 10.0
